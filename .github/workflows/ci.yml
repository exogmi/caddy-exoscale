name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    # GitHub's host is Ubuntu; all job commands run in Debian.
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    strategy:
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - name: Install Debian test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 gcc libc6-dev libstdc++6
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod download
      - run: go mod verify
      - name: Test release versioning
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate GitHub workflows
        if: matrix.go == '1.27.x'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test -tags integration -run '^$' ./...
      - run: go build -trimpath -o caddy ./cmd/caddy
      - name: Check module registration
        run: ./caddy list-modules | grep -Fx dns.providers.exoscale
      - name: Validate example Caddyfile without API access
        env:
          EXOSCALE_API_KEY: mock-key
          EXOSCALE_API_SECRET: mock-secret
        run: ./caddy adapt --config examples/Caddyfile --validate > /dev/null
      - name: Install Debian Docker client
        if: matrix.go == '1.27.x'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker-cli
          rm -rf /var/lib/apt/lists/*
      - uses: docker/setup-buildx-action@v4
        if: matrix.go == '1.27.x'
      - name: Build Debian runtime image for Linux AMD64
        if: matrix.go == '1.27.x'
        run: docker buildx build --platform linux/amd64 --load -t caddy-exoscale:test .
      - name: Check Docker module registration
        if: matrix.go == '1.27.x'
        run: bash .github/scripts/smoke-image.sh caddy-exoscale:test amd64
